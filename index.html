<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="品誉企业绩效与薪酬诊断：10 分钟看懂公司的绩效与薪酬缺口。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15233F; --ink-2:#3C4A66; --mute:#6B778C;
  --seal:#B3121B; --seal-soft:#FBE8E9;
  --amber:#B97A06; --amber-soft:#FCF1DA;
  --green:#2F7A55; --green-soft:#E3F2EA;
  --paper:#FFFFFF; --bg:#FBF3F2; --line:#EBD9D7; --focus:#B3121B;
  --barbg:#B3121B; --bartext:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8ECF4; --ink-2:#C2CAD8; --mute:#8D98AC;
    --seal:#F0525B; --seal-soft:#3A1B1F; --amber:#E8B04A; --amber-soft:#3A2E17;
    --green:#5CC08E; --green-soft:#16302A; --paper:#1C1618; --bg:#120D0E; --line:#3A2A2C; --focus:#F0525B;
    --barbg:#2A1416; --bartext:#F6E9EA;
  }
}
:root[data-theme="dark"]{
  --ink:#E8ECF4; --ink-2:#C2CAD8; --mute:#8D98AC;
  --seal:#F0525B; --seal-soft:#3A1B1F; --amber:#E8B04A; --amber-soft:#3A2E17;
  --green:#5CC08E; --green-soft:#16302A; --paper:#1C1618; --bg:#120D0E; --line:#3A2A2C; --focus:#F0525B;
  --barbg:#2A1416; --bartext:#F6E9EA;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7}
h1,h2,h3{font-family:"Noto Serif SC","Songti SC",serif;line-height:1.3;margin:0}
h1{font-size:27px;font-weight:900} h2{font-size:21px;font-weight:700} h3{font-size:17px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--barbg);color:var(--bartext);
  box-shadow:0 2px 12px rgba(179,18,27,.18)}
.bar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;flex:1;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:50%;background:#fff;padding:2px;flex:none;object-fit:contain}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(255,255,255,.7);background:none;border:0;padding:6px 0;white-space:nowrap}
.switch i{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.28);position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-pressed="true"]{color:#fff;font-weight:700}
.switch[aria-pressed="true"] i{background:#F0C64C}
.switch[aria-pressed="true"] i::after{transform:translateX(16px)}
.prog{max-width:780px;margin:0 auto;padding:0 16px 10px}
.prog-t{display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.72)}
.prog-t b{color:#fff}
.prog-b{height:4px;background:rgba(255,255,255,.22);border-radius:2px;margin-top:4px;overflow:hidden}
.prog-b i{display:block;height:100%;background:#F0C64C;transition:width .3s}

main{max-width:780px;margin:0 auto;padding:20px 16px 120px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(90,20,24,.05)}
.sheet+.sheet{margin-top:14px}
.lead{color:var(--ink-2);margin-top:8px}
.small{font-size:14px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--seal);color:#fff;text-decoration:none;min-height:48px;text-align:center;box-shadow:0 2px 8px rgba(179,18,27,.22)}
.btn.seal{background:var(--seal);color:#fff}
.btn.ghost{box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 150px}

label.f{display:block;margin-top:14px}
label.f>span{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
label.f>span em{color:var(--seal);font-style:normal}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--paper);min-height:46px}
.inp:focus{border-color:var(--ink)}
textarea.inp{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media(max-width:520px){.two,.three{grid-template-columns:1fr 1fr}}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
.group-t{font-size:14px;font-weight:700;color:var(--mute);margin-top:20px;padding-bottom:6px;border-bottom:1px solid var(--line)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:520px){.modes{grid-template-columns:1fr}}
.mode{border:1.5px solid var(--line);border-radius:12px;padding:16px;text-align:left;background:var(--paper)}
.mode h3{margin-bottom:4px}
.mode p{font-size:14px;color:var(--ink-2)}
.mode.primary{border-color:var(--seal);background:var(--seal-soft)}
.mode.primary h3{color:var(--seal)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--seal);background:var(--seal);color:#fff}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.toprow:first-child{border-top:0}
.star{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;font-size:14px;white-space:nowrap}
.star[aria-pressed="true"]{border-color:var(--seal);background:var(--seal-soft);color:var(--seal);font-weight:700}

.q{padding:18px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q-dim{flex:none;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mute)}
.q-text{font-weight:700;flex:1 1 200px}
.ev{margin-left:auto;font-size:13px;border:1px solid var(--line);background:none;border-radius:6px;padding:2px 9px;color:var(--mute)}
.ev[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:var(--green-soft);font-weight:700}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;font-size:15px;line-height:1.5}
.opt b{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--seal);background:var(--seal-soft)}
.opt[aria-pressed="true"] b{background:var(--seal);border-color:var(--seal);color:#fff}

.cv{display:none}
body.consult .cv{display:block}
.tip{background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:12px 14px;font-size:15px;margin-top:14px}
.tip strong{display:block;font-size:13px;color:var(--amber);margin-bottom:2px}

.card{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-h b{font-size:15px}
.x{border:0;background:none;color:var(--mute);font-size:14px;padding:4px 8px}
.card label.f{margin-top:10px}
.card label.f>span{font-size:13px;font-weight:500;color:var(--ink-2)}
.yn{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.yn:first-of-type{border-top:0}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:6px 10px;font-size:14px;min-width:44px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--seal);color:#fff;font-weight:700}
.range{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:15px}
.range input{flex:1;accent-color:var(--seal)}
.range b{font-family:"Noto Serif SC",serif;font-size:20px;min-width:28px;text-align:right}

.navrow{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--seal);z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.navrow-in{max-width:780px;margin:0 auto;display:flex;gap:10px}
.navrow .btn{flex:1}
.navrow .btn.ghost{flex:0 0 auto}

.list{margin-top:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border:0;border-top:1px solid var(--line);text-align:left;background:none;width:100%}
.item:first-child{border-top:0}
.item .nm{font-weight:700}
.item .meta{font-size:13px;color:var(--mute)}
.item .sc{grid-row:1/3;grid-column:2;align-self:center;font-family:"Noto Serif SC",serif;font-weight:900;font-size:22px}
.st-tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 7px;margin-left:6px;background:var(--bg);color:var(--ink-2);font-weight:500}
.st-tag.win{background:var(--green-soft);color:var(--green)}
details.method summary{cursor:pointer;font-weight:700;padding:4px 0}
details.method ul{margin:10px 0 0;padding-left:20px;color:var(--ink-2);font-size:15px}
details.method li{margin-bottom:6px}

/* report */
.rp-head{border-bottom:3px solid var(--seal);padding-bottom:14px;display:flex;gap:14px;align-items:flex-start}
.rp-logo{width:56px;height:56px;flex:none;object-fit:contain}
.rp-meta{font-size:14px;color:var(--ink-2);margin-top:6px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:20px 0 4px}
@media(max-width:520px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.stamp{width:136px;height:136px;border-radius:50%;border:4px solid var(--seal);color:var(--seal);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-9deg);position:relative;flex:none}
.stamp::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid var(--seal)}
.stamp .lv{font-family:"Noto Serif SC",serif;font-weight:900;font-size:44px;line-height:1}
.stamp .lvn{font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;margin-top:2px}
.stamp.go{animation:stamp .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes stamp{0%{opacity:0;transform:rotate(-9deg) scale(1.6)}70%{opacity:1;transform:rotate(-9deg) scale(.94)}100%{transform:rotate(-9deg) scale(1)}}
.verdict .pct{font-family:"Noto Serif SC",serif;font-weight:900;font-size:42px;line-height:1}
.verdict .pct small{font-size:16px;color:var(--mute);font-weight:700}
.verdict p{margin-top:8px;color:var(--ink-2)}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px;font-size:12px;color:var(--mute);text-align:center}
.ladder div{padding-top:6px;border-top:4px solid var(--line)}
.ladder .on{border-top-color:var(--seal);color:var(--seal);font-weight:700}
.exec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.exec p{margin-top:8px;color:var(--ink-2)}
.exec p b{color:var(--ink)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr}}
.kpis div{border:1px solid var(--line);border-radius:10px;padding:12px}
.kpis b{display:block;font-family:"Noto Serif SC",serif;font-size:22px;font-weight:900;line-height:1.25}
.kpis span{font-size:13px;color:var(--ink-2)}
.kpis .bad b{color:var(--seal)}

.radar-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;margin-top:10px}
@media(max-width:620px){.radar-wrap{grid-template-columns:1fr}}
.radar{width:100%;max-width:360px;margin:0 auto;display:block}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:88px 1fr 42px;gap:10px;align-items:center;font-size:14px}
.bar-row .tr{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:5px}
.bar-row .v{text-align:right;font-weight:700}
.lvl-r{background:var(--seal)} .lvl-a{background:var(--amber)} .lvl-g{background:var(--green)}

.alert{border-radius:12px;padding:16px;margin-top:14px}
.alert.r{background:var(--seal-soft);border:1px solid var(--seal)}
.alert.a{background:var(--amber-soft);border:1px solid var(--amber)}
.alert h3{margin-bottom:6px}
.alert.r h3{color:var(--seal)} .alert.a h3{color:var(--amber)}

.tri{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.tri th,.tri td{padding:9px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tri th{font-weight:700;color:var(--mute);font-size:13px;border-top:0}
.tri td.n{text-align:right;white-space:nowrap;font-weight:700}
.tri .flag{color:var(--seal);font-weight:700}
.tbl-wrap{overflow-x:auto}

.pay{display:grid;gap:10px;margin-top:12px}
.pay-row{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pay-row .h{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.pay-row .m{font-size:13px;color:var(--ink-2);margin-top:4px}
.pay-row ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.pay-row li.bad{color:var(--seal)} .pay-row li.ok{color:var(--green)}

.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.quad{border-radius:10px;padding:12px;min-height:110px;border:1px solid var(--line)}
.quad h3{font-size:15px}
.quad p{font-size:12px;color:var(--mute)}
.quad ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.quad.win{background:var(--green-soft);border-color:var(--green)}
.quad.win h3{color:var(--green)}
.quad.big{background:var(--seal-soft);border-color:var(--seal)}
.quad.big h3{color:var(--seal)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}

.recs{counter-reset:r;margin-top:12px;display:grid;gap:12px}
.rec{border:1px solid var(--line);border-radius:12px;padding:16px 16px 16px 58px;position:relative}
.rec::before{counter-increment:r;content:counter(r);position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;background:var(--seal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.rec .st{font-size:13px;color:var(--mute)}
.rec p{margin-top:6px;color:var(--ink-2);font-size:15px}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:10px 0 0;font-size:14px}
.rec dt{color:var(--mute)} .rec dd{margin:0;font-weight:500}
.road{margin-top:12px;border-left:2px solid var(--line);padding-left:18px;display:grid;gap:16px}
.road div{position:relative}
.road div::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.road b{display:block;font-size:14px;color:var(--mute)}
.road ul{margin:4px 0 0;padding-left:18px}

.ai-out{white-space:pre-wrap;margin-top:12px;font-size:15px;color:var(--ink-2)}
.ai-out:empty{display:none}
.ai-state{font-size:14px;color:var(--mute);margin-top:8px}
.ai-state:empty{display:none}
.offer{border:2px solid var(--seal);border-radius:12px;padding:16px;margin-top:12px}
.offer h3{color:var(--seal)}
.script h3{font-size:15px;margin-top:16px}
.script p,.script li{font-size:15px;color:var(--ink-2)}
.script ul{padding-left:20px;margin:6px 0 0}
.script li{margin-bottom:8px}
.script q{quotes:"“" "”";color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.stamp.go{animation:none}.switch i,.switch i::after,.prog-b i{transition:none}}
@media print{.bar,.navrow,.no-print{display:none!important}body{background:#fff}main{padding:0}}

/* ===== 咨询会互动 ===== */
.stage{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;margin-right:6px;background:var(--seal);color:#fff}
.stage.s2{background:#8E1016} .stage.s3{background:#D98A0B;color:#3A2400} .stage.s4{background:var(--green)}
.bar .stage{background:#F0C64C;color:#5A1D06}
.ask{font-family:"Noto Serif SC",serif;font-size:21px;font-weight:700;line-height:1.45;margin-top:10px}
.found{margin-top:14px;border-radius:12px;padding:16px;background:linear-gradient(135deg,#7E0D14,#B3121B);color:#fff}
.found .k{font-size:13px;opacity:.75}

.found.red{background:linear-gradient(135deg,#B3121B,#D93A2B)}
.found+.found{margin-top:10px}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.slider:first-of-type{border-top:0}
.slider label{font-size:15px}
.slider label small{display:block;color:var(--mute);font-size:12px}
.slider b{font-family:"Noto Serif SC",serif;font-size:20px;min-width:52px;text-align:right}
.slider input{grid-column:1/3;width:100%;accent-color:var(--seal)}
.slider.sys label::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--seal);margin-right:6px}
.slider.own label::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--ink-2);margin-right:6px}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;margin-top:12px;background:var(--bg)}
.stack i{display:block;height:100%}
.chain{display:grid;gap:0;margin-top:14px}
.chain div{border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;position:relative;background:var(--paper)}
.chain div+div{margin-top:22px}
.chain div+div::before{content:"为什么？";position:absolute;top:-21px;left:18px;font-size:12px;color:var(--mute)}
.chain small{display:block;font-size:12px;color:var(--mute)}
.chain .root{border-color:var(--seal);background:var(--seal-soft)}
.chain .bar{border-color:var(--amber);background:var(--amber-soft)}
.pick{display:grid;gap:8px;margin-top:10px}
.pick button{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px}
.pick button[aria-pressed="true"]{border-color:var(--seal);background:var(--seal);color:#fff;font-weight:700}
.goalrow{display:grid;grid-template-columns:1.1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.goalrow:first-of-type{border-top:0}
@media(max-width:520px){.goalrow{grid-template-columns:1fr 1fr}.goalrow .seg{grid-column:1/3}}
.goalrow .inp{min-height:42px;padding:8px 10px}
.goalrow .inp.empty{border-color:var(--seal);background:var(--seal-soft)}
.dep{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.dep:first-of-type{border-top:0}
.scatter{width:100%;max-width:520px;display:block;margin:10px auto 0}
.flags{margin:10px 0 0;padding-left:18px}
.flags li{margin-bottom:6px;font-size:15px}
.flags li.bad{color:var(--seal)}
.planitem{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.planitem.on{border-color:var(--ink)}
.planitem .h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.planitem .h b{font-size:16px}
.planitem .h small{display:block;color:var(--mute);font-size:13px;font-weight:400}
.planitem .body{margin-top:10px}
.planitem:not(.on) .body{display:none}
.conf{display:flex;gap:6px;margin-top:6px}
.conf button{flex:1;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 0;font-weight:700}
.conf button[aria-pressed="true"]{background:var(--seal);color:#fff;border-color:var(--seal)}
.sign{border-top:2px solid var(--ink);margin-top:18px;padding-top:12px}
.quote{border-left:4px solid var(--seal);padding:4px 0 4px 14px;margin-top:12px;font-family:"Noto Serif SC",serif;font-size:17px;color:var(--ink)}
.quote small{display:block;font-family:"Noto Sans SC",sans-serif;font-size:12px;color:var(--mute);margin-top:2px}
.delta{font-weight:700} .delta.up{color:var(--green)} .delta.down{color:var(--seal)}
.flowmap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.flowmap div{border-top:4px solid var(--line);padding-top:6px;font-size:13px;color:var(--ink-2)}
.flowmap b{display:block;color:var(--ink);font-size:14px}
.flowmap .s1{border-color:var(--ink)} .flowmap .s2{border-color:var(--ink-2)} .flowmap .s3{border-color:var(--seal)} .flowmap .s4{border-color:var(--green)}
@media(max-width:520px){.flowmap{grid-template-columns:1fr 1fr}}
.log{margin-top:10px}
.log div{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log b{color:var(--mute);font-weight:500;margin-right:8px}
.fwlist{display:grid;gap:10px;margin-top:14px}
.fw{border:1px solid var(--line);border-radius:12px;padding:14px}
.fw.red{border-color:var(--seal);background:var(--seal-soft)}
.fw.amber{border-color:var(--amber);background:var(--amber-soft)}
.fw-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fw-no{font-family:"Noto Serif SC",serif;font-weight:900;font-size:24px;color:var(--seal);line-height:1}
.fw-h b{font-size:17px}
.fw-h small{display:block;font-size:13px;color:var(--mute)}
.fw-sc{margin-left:auto;font-size:13px;font-weight:700}
.fw p{margin-top:8px;font-size:15px;color:var(--ink-2)}

/* ================== 设计精修 ================== */
:root{ --gold:#C8A250; --gold-soft:#F6EEDC; --shadow:0 1px 2px rgba(90,20,24,.04),0 8px 24px -12px rgba(90,20,24,.18); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --gold:#E0BE6E; --gold-soft:#2E2413; --shadow:0 8px 24px -12px rgba(0,0,0,.6);} }
:root[data-theme="dark"]{ --gold:#E0BE6E; --gold-soft:#2E2413; }

body{-webkit-font-smoothing:antialiased;letter-spacing:.01em}
.pct,.big,.kpis b,.cost b,.verdict .pct,.slider b,.fw-no,.item .sc{font-variant-numeric:tabular-nums}
h1,h2{letter-spacing:.02em}
.sheet{box-shadow:var(--shadow);border-radius:16px;padding:22px}
@media(min-width:768px){.sheet{padding:26px}}
main{padding-top:24px}

/* 章节标题：金色细线 + 序号感 */
.sheet>h2:first-child,.sheet>h1:first-child{position:relative;padding-bottom:12px}
.sheet>h2:first-child::after,.sheet>h1:first-child::after{content:"";position:absolute;left:0;bottom:0;width:44px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--seal),var(--gold))}
.sheet[style*="text-align:center"]>h1::after{left:50%;transform:translateX(-50%)}
.group-t{letter-spacing:.08em;border-bottom-color:var(--gold-soft)}

/* 顶栏：红底 + 细金线 */
.bar{background:linear-gradient(180deg,#C0161F,#960E16);border-bottom:2px solid var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar{background:linear-gradient(180deg,#3A1A1D,#22090C)}}
.brand{letter-spacing:.04em;font-family:"Noto Serif SC",serif}
.brand-mark{box-shadow:0 0 0 1.5px var(--gold),0 2px 6px rgba(0,0,0,.25)}

/* 首页 hero */
.hero-card{background:linear-gradient(150deg,#B3121B 0%,#8A0D14 60%,#6E0A10 100%);color:#fff;border:0;position:relative;overflow:hidden;text-align:center}
.hero-card::after{content:"";position:absolute;right:-60px;bottom:-70px;width:230px;height:230px;border-radius:50%;
  border:2px solid rgba(255,255,255,.12);box-shadow:0 0 0 22px rgba(255,255,255,.05)}
.hero-card h1{color:#fff;position:relative;z-index:1}
.hero-card h1::after{background:var(--gold)!important}
.hero-card .lead{color:rgba(255,255,255,.88);position:relative;z-index:1}
.lockup{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.lockup img{width:64px;height:64px;object-fit:contain;flex:none}
.lockup span{font-family:"Noto Serif SC",serif;font-weight:900;font-size:46px;line-height:1;letter-spacing:.06em;color:var(--gold)}
@media(max-width:420px){.lockup{gap:10px}.lockup img{width:52px;height:52px}.lockup span{font-size:38px}}
.hero-card img{filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}

/* 流程图 */
.flowmap div{border-top-width:3px}
.flowmap .s1{border-color:var(--gold)} .flowmap .s2{border-color:rgba(255,255,255,.5)}
.flowmap .s3{border-color:rgba(255,255,255,.35)} .flowmap .s4{border-color:rgba(255,255,255,.25)}
.hero-card .flowmap div{color:rgba(255,255,255,.78)} .hero-card .flowmap b{color:#fff}

/* 模式卡 */
.mode{position:relative;padding:18px 18px 18px 20px;border-radius:14px;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.mode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.mode.primary::before{background:linear-gradient(180deg,var(--seal),var(--gold))}
.mode:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--seal)}
.mode h3{display:flex;align-items:baseline;gap:8px}

/* 选项与按钮质感 */
.opt,.pick button,.chip,.seg button,.conf button{transition:background .15s,border-color .15s,color .15s,transform .1s}
.opt:active,.pick button:active,.conf button:active{transform:scale(.99)}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--seal)}
.btn{letter-spacing:.04em}
.btn.seal{background:linear-gradient(180deg,#C0161F,#9C0F17)}
.btn:not(.ghost):hover{filter:brightness(1.06)}

/* 发现卡：加一层纹理与金标 */
.found{box-shadow:0 10px 24px -14px rgba(179,18,27,.8);position:relative;overflow:hidden}
.found::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.found .k{letter-spacing:.14em;color:var(--gold);opacity:1;font-weight:700}
.found .big{letter-spacing:.01em}

/* 报告封面 */
.rp-head{position:relative}
.rp-logo{filter:drop-shadow(0 2px 6px rgba(179,18,27,.25))}
.hero{position:relative}
.hero::before{content:"";position:absolute;right:-10px;top:-10px;width:170px;height:170px;background:var(--seal);opacity:.04;
  -webkit-mask:radial-gradient(circle,#000 62%,transparent 63%);mask:radial-gradient(circle,#000 62%,transparent 63%);pointer-events:none}
.stamp{box-shadow:0 8px 20px -12px rgba(179,18,27,.9)}
.ladder .on{position:relative}
.verdict .pct small{letter-spacing:.06em}

/* 五大框架卡 */
.fw{transition:transform .15s,box-shadow .15s}
.fw:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.fw-no{background:linear-gradient(135deg,var(--seal),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.offer{border-width:2px;border-radius:14px;background:linear-gradient(180deg,var(--seal-soft),transparent)}

/* 引述与表格 */
.quote{border-left-color:var(--gold);background:linear-gradient(90deg,var(--gold-soft),transparent);border-radius:0 10px 10px 0;padding:10px 14px}
.tri th{letter-spacing:.06em}
.item{transition:background .15s;border-radius:10px;padding-left:8px;padding-right:8px}
.item:hover{background:var(--seal-soft)}
.st-tag{border:1px solid var(--line)}
.st-tag.win{border-color:var(--green)}

/* 底部导航 */
.navrow{border-top:0;box-shadow:0 -8px 24px -16px rgba(90,20,24,.5)}
.navrow::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--seal),var(--gold))}


/* ================== 全屏自适应与字号 ================== */
html{font-size:100%}
body{font-size:clamp(17px,1.05vw,20px);line-height:1.75}

 {id:1,name:'战略与目标',short:'目标',src:'平衡计分卡 / OKR',desc:'公司目标有没有从老板脑子里，拆到每个人手上。',

 '7.4':['画出晋升通道','每个岗位写出下一步是什么、要达到什么绩效、多久可以升。优秀员工看得到未来才会留。','老板和 HR','2 条主要岗位的晋升标准公布',2,2],
 '7.5':['建立低绩效处理流程','改进计划、调岗、再给期限、按程序离职，每一步有书面记录，并符合劳工法程序。','HR','流程成文，主管都知道',2,2],
 '8.1':['主管也要被考核','主管指标一半看团队结果，一半看带人：团队流失率、面谈完成率、下属达标率。','老板','每位主管有自己的考核表',3,2],
 '8.2':['训练主管做目标设定和面谈','给主管一套标准做法：怎么拆目标、怎么谈、怎么记录。先示范一次，再让主管自己做。','老板或外部导师','每位主管完成一次有记录的面谈',3,2],
 '8.3':['每个主管指定一位接班人','接班人先代理主持周会、处理部分审批，半年内能顶替主管一周。','各部门主管','每个部门有指定接班人',2,2],
 '8.4':['主管收入挂团队结果','主管的浮动奖金按团队达成率计算，团队流失率超标要扣分。','老板和 HR','主管奖金方案定稿',3,2],
 '8.5':['按主管看流失率','每季统计每位主管团队的离职人数和原因。人是跟主管走的，流失率高的主管要先辅导。','HR','第一份按主管的流失率报表',2,1],
 '9.1':['每月一次 1 小时复盘会','四个问题：目标是什么、结果是什么、差距原因、下个月改什么。结论写下来，下次第一件事检查。','老板主持','连续一个月有复盘记录',3,1],
 '9.2':['用绩效结果做人事决定','培训、调岗、晋升、淘汰都引用最近 3 个月绩效，不再凭印象。','老板和 HR','至少 1 个人事决定有绩效依据',2,1],
 '9.3':['每季检讨一次制度','每季末问主管：哪个指标不合理、哪个奖惩没效果、下季改什么。','HR','排定下一次季度检讨日期',2,1],
 '9.4':['把只有老板能做的事，逐件交出去','列出这周老板亲自处理的事，能写成标准的交给主管，并挂上对应指标。','老板','交出至少 3 件日常决定',3,2],

function peopleA(s){

function depA(s){ const only = DEPS.filter((_,i)=>s.dep[i]).length; return {only, total:DEPS.length, share: only/DEPS.length}; }
function futureA(s, c){

function payAnalysis(s){
  const rows = (s.payRows||[]).filter(r => r.title && num(r.n)); let monthly = 0;
  const out = rows.map(r => {
    const n=num(r.n), lo=num(r.min), hi=num(r.max), avg=num(r.avg)||((lo+hi)/2), v=num(r.var), ns=num(r.newStart), mk=num(r.market);
    monthly += n*(avg+v);
    const share = (avg+v) ? v/(avg+v) : 0, band = lo && hi ? hi/lo : 0, compa = mk ? avg/mk : 0, sug = PAYCAT[r.cat] || [.1,.3], flags = [];
    if (share < sug[0]) flags.push(['bad',`浮动只占 ${pc(share)}，${r.cat}岗位建议 ${pc(sug[0])} 到 ${pc(sug[1])}`]);
    else if (share > sug[1]) flags.push(['bad',`浮动占 ${pc(share)}，高于建议上限 ${pc(sug[1])}，收入波动大`]);
    else flags.push(['ok',`浮动占 ${pc(share)}，在建议范围内`]);
    if (band && band > 2) flags.push(['bad',`同岗位最高是最低的 ${band.toFixed(1)} 倍，要检查差距有没有依据`]);

    if (ns && avg && ns >= avg*.95) flags.push(['bad',`新人起薪 ${rm(ns)} 接近或高于在职平均 ${rm(avg)}，有倒挂风险`]);
    if (compa && compa < .9) flags.push(['bad',`平均底薪只有市场的 ${pc(compa)}，流失和招聘风险高`]);
    if (compa && compa > 1.15) flags.push(['bad',`平均底薪是市场的 ${pc(compa)}，要确认产出匹配`]);
    if (compa && compa >= .9 && compa <= 1.15) flags.push(['ok',`与市场相比 ${pc(compa)}，属合理范围`]);

function staffAnalysis(s){

}
function compute(s){
  const keep = S; S = s;
  const mods = MODS.filter(m => qsFor(m).length).map(m => { const qs = qsFor(m); const sum = qs.reduce((a,q)=>a+(s.answers[q.k] ?? 0),0); return {id:m.id,name:m.name,short:m.short,sum,pct:sum/(qs.length*3)}; });
  const pct = mods.reduce((a,b)=>a+b.pct,0)/mods.length;
  const level = LEVELS.find(l => pct < l.max);
  const red = [...mods].sort((a,b)=> a.pct-b.pct || a.id-b.id)[0];
  const W = {1:1.3,2:1.2,3:1.2,4:1.1,5:1.1,6:1,7:1,8:1.1,9:.9};
  const whyKeys = whyA(s).keys;
  const cand = ALLQ.filter(q => s.mode==='deep' || q.c || whyKeys.includes(q.k)).map(q => {
    const gap = 3 - (s.answers[q.k] ?? 0), r = REC[q.k];
    return {...q, gap, impact:r[4], effort:r[5], score: gap*W[q.m]*(1+r[4]*.25) - r[5]*.3 + (whyKeys.includes(q.k) ? 3 : 0)};
  }).filter(q => q.gap >= 2 || whyKeys.includes(q.k)).sort((a,b)=> b.score-a.score);

function scatterSVG(ps){
  const W=520,H=280,L=56,B=40,T=16,Rr=16, pays = ps.map(x=>num(x.pay)), lo = Math.min(...pays)*.9, hi = Math.max(...pays)*1.05 || 1;
  const X = v => L + (v-1)/4*(W-L-Rr), Y = v => H-B - (v-lo)/(hi-lo||1)*(H-B-T);
  const grid = [1,2,3,4,5].map(v=>`<line x1="${X(v)}" y1="${T}" x2="${X(v)}" y2="${H-B}" stroke="var(--line)"/><text x="${X(v)}" y="${H-B+18}" text-anchor="middle" font-size="12" fill="var(--mute)">${v}</text>`).join('');
  const yl = [lo,(lo+hi)/2,hi].map(v=>`<text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(v).toLocaleString('en-MY')}</text>`).join('');
  const ideal = `<line x1="${X(1)}" y1="${Y(lo)}" x2="${X(5)}" y2="${Y(hi)}" stroke="var(--green)" stroke-dasharray="5 5" stroke-width="1.5"/>`;
  const pts = ps.map(x=>{ const cx=X(+x.perf), cy=Y(num(x.pay)), bad = (x.perf>=4 && num(x.pay)<(lo+hi)/2) || (x.perf<=2 && num(x.pay)>(lo+hi)/2);
    return `<circle cx="${cx}" cy="${cy}" r="7" fill="${bad?'var(--seal)':'var(--ink)'}"/><text x="${cx+10}" y="${cy+4}" font-size="13" font-weight="700" fill="var(--ink)">${esc(x.name)}</text>`; }).join('');
  return `<svg class="scatter" viewBox="0 0 ${W} ${H}" role="img" aria-label="表现与薪水对照图">${grid}${yl}${ideal}${pts}
    <text x="${(W+L)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--mute)">表现分 →</text></svg>
    <p class="small">绿色虚线是"表现越好，薪水越高"应有的样子。红点是明显偏离的人。</p>`;
}

function futureSVG(years){
  const W=520,H=230,L=16,B=34,T=14, max = Math.max(...years.map(y=>y.sum),1), bw = 90, gap = (W-L*2-bw*3)/2;
  return `<svg class="scatter" viewBox="0 0 ${W} ${H}" role="img" aria-label="3 年可拿回的价值">${years.map((y,i)=>{
    const x = L + i*(bw+gap); let yy = H-B; const seg = (v,col)=>{ const h = v/max*(H-B-T-18); yy -= h; return `<rect x="${x}" y="${yy}" width="${bw}" height="${h}" fill="${col}"/>`; };
    return seg(y.eff,'var(--seal)') + seg(y.turn,'var(--amber)') + seg(y.boss,'var(--ink-2)') +
      `<text x="${x+bw/2}" y="${yy-6}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${Math.round(y.sum/1000).toLocaleString('en-MY')}k</text><text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--mute)">第 ${i+1} 年</text>`;
  }).join('')}</svg>
  <p class="small"><span style="color:var(--seal)">■</span> 人效提升　<span style="color:var(--amber)">■</span> 少走的人　<span style="color:var(--ink-2)">■</span> 老板时间（释放一半）。第 1 年按半年见效计算。</p>`;
}

function radarSVG(mods, base){
  const cx=180, cy=160, R=104, n=mods.length;
  const pt = (i, r) => { const a = (-90 + i*360/n) * Math.PI/180; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  const ring = k => `<polygon points="${mods.map((_,i)=>pt(i,R*k).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
  const axes = mods.map((_,i)=>{ const [x,y]=pt(i,R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join('');
  const poly = arr => arr.map((v,i)=>pt(i, R*Math.max(.04,v)).join(',')).join(' ');
  const labels = mods.map((s,i)=>{ const [x,y]=pt(i,R+20); const a = Math.abs(x-cx)<6?'middle':(x>cx?'start':'end'); return `<text x="${x}" y="${y+5}" text-anchor="${a}" font-size="14" font-weight="700" fill="var(--ink)">${s.short}</text>`; }).join('');
  return `<svg class="radar" viewBox="0 0 360 320" role="img" aria-label="九大模块得分雷达图">${[.25,.5,.75,1].map(ring).join('')}${axes}
    ${base ? `<polygon points="${poly(base)}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 4"/>` : ''}
    <polygon points="${poly(mods.map(m=>m.pct))}" fill="var(--seal)" fill-opacity=".18" stroke="var(--seal)" stroke-width="2"/>${labels}</svg>`;
}

function liveWhyStatic(c){
  const top = c.topPains[0] || '员工没有做到老板要的结果', durTxt = {half:'不到半年','1-2':'1 到 2 年','3+':'3 年以上'}[c.why.dur];
  return `<h3 style="margin-top:16px">根源链</h3><div class="chain">
    <div><small>老板感受到的症状</small>${esc(top)}</div>
    <div><small>直接原因</small>${c.why.l1.map(x=>esc(x[1])).join('；')}</div>
    ${c.why.l2.length ? `<div class="root"><small>制度缺口</small>${c.why.l2.map(x=>esc(x.gap)).join('；')}</div>` : ''}
    ${c.why.l3.length ? `<div class="bar"><small>一直没改的原因${durTxt?'，已经持续 '+durTxt:''}</small>${c.why.l3.map(x=>esc(x[1])).join('；')}</div>` : ''}
  </div>`;
}

  const L = [`【${p.company||'贵公司'} 绩效与薪酬诊断】`, `总分 ${Math.round(c.pct*100)} / 100，${c.level.lv} ${c.level.name}`, ''];
  if (c.why.l2.length) L.push(`您找到的根源：${c.why.l2.map(x=>x.gap).join('、')}`);
  if (c.time.sys) L.push(`每周被制度问题吃掉 ${c.time.sys} 小时，一年约 ${rm(c.time.yearRM)}`);
  if (c.payroll) L.push(`按您的假设，3 年不改变放弃约 ${rm(c.future.cum)}`);
  L.push('', '九大模块：' + c.mods.map(m=>`${m.name} ${pc(m.pct)}`).join('，'), '');
  if (plan.length){ L.push('您决定先做：'); plan.forEach(([k,x],i)=>L.push(`${i+1}. ${REC[k][0]}（${x.owner||'负责人待定'}${x.due?'，'+x.due:''}）`)); }

let aiCtl = null;
async function runAI(kind){
  const out = document.getElementById('ai_'+kind), st = document.getElementById('ai_'+kind+'_s');
  aiCtl?.abort(); aiCtl = new AbortController();
  out.textContent = ''; st.textContent = '正在分析，通常需要 20 到 60 秒…';
  document.querySelectorAll('[data-ai]').forEach(b=>b.disabled=true);
  try {
    const {text, truncated} = await SAMPLE(AI_PROMPT[kind](aiData()), {signal: aiCtl.signal, modelTier:'complex', onText: ({text}) => { st.textContent=''; out.textContent = text; }});
    out.textContent = text; st.textContent = truncated ? '内容被截短，可以再生成一次。' : '';
    S.ai[kind] = text; save(true);
  } catch(e){
    out.textContent = e.text || '';
    st.textContent = ({cancelled:'已停止。', not_granted:'没有允许使用 AI，报告其他部分不受影响。', rate_limited:'请求太频繁，稍等一分钟再试。', prompt_too_large:'资料太长，请减少记录后再试。'})[e.code] || 'AI 暂时无法生成，请稍后再试。';
    if (e.code === 'not_granted') document.querySelectorAll('.ai-box').forEach(el => el.hidden = true);
  } finally { document.querySelectorAll('[data-ai]').forEach(b=>b.disabled=false); }
}

function loadScript(src){ return new Promise((res,rej)=>{ const el=document.createElement('script'); el.src=src; el.onload=res; el.onerror=rej; document.head.appendChild(el); }); }
function blobDownload(){
  return {save: async ({filename, data}) => {
    const url = URL.createObjectURL(new Blob([data], {type:'text/html;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }};
}
function endpointSample(url){
  return async (promptText, opts = {}) => {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({prompt: promptText}), signal: opts.signal});
    if (!r.ok){ const e = new Error('ai'); e.code = r.status === 429 ? 'rate_limited' : 'server'; throw e; }
    const j = await r.json();
    const text = j.text || (j.content||[]).map(x=>x.text||'').join('');
    if (opts.onText) opts.onText({text});
    return {text, truncated: !!j.truncated};
  };
}
